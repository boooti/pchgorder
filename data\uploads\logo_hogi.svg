<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hogiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#hogiGrad)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,3" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Cup & Leaves -->
  <g transform="translate(100, 78) scale(0.9)">
    <!-- Coffee Cup -->
    <path d="M-22,-5 C-22,22 22,22 22,-5 Z" fill="url(#goldGrad)" />
    <!-- Handle -->
    <path d="M22,0 C30,0 30,12 22,12" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Tea leaves steam -->
    <path d="M-8,-12 C-14,-22 -4,-28 -4,-34 C2,-28 0,-20 -8,-12 Z" fill="#38bdf8" />
    <path d="M8,-12 C14,-22 4,-28 4,-34 C-2,-28 0,-20 8,-12 Z" fill="#34d399" />
  </g>
  
  <!-- Text -->
  <text x="100" y="132" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="3">HOGI</text>
  <text x="100" y="152" text-anchor="middle" fill="url(#goldGrad)" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" letter-spacing="2">COFFEE &amp; TEA</text>
</svg>
