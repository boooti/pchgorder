  <text x="120" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="1">TƯƠI MÁT NHỨC NGƯỜI</text>
